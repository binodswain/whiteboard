name: Docker web smoke

on:
  pull_request:
    paths-ignore:
      # Keep this an ignore list, not an allow-list: root manifests/lockfiles
      # and bundled workspace packages are Docker build inputs too.
      - "apps/review-desktop/**"
      - "diffr/**/*.rs"
      - "diffr/**/Cargo.toml"
      - "diffr/Cargo.lock"
      - "docs/**"
      - "*.md"

permissions:
  contents: read

jobs:
  docker-web-smoke:
    name: Build and smoke-test Docker web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: >-
          docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          load: true
          tags: whiteboard:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # The root package.json uses pnpm's catalog: protocol, which npm
      # cannot parse; install the smoke harness inside its own directory.
      - name: Install Playwright
        working-directory: scripts/docker-smoke
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start container and smoke-test
        env:
          WHITEBOARD_TOKEN: ci-smoke-token-with-at-least-32-characters
        run: |
          set -euo pipefail
          CODE_ROOT="$PWD/scripts/docker-smoke/repository"
          mkdir -p artifacts
          chmod -R a+rwx scripts/docker-smoke/repository
          git -C scripts/docker-smoke/repository init
          git -C scripts/docker-smoke/repository config user.name "CI smoke"
          git -C scripts/docker-smoke/repository config user.email \
            "ci@example.invalid"
          git -C scripts/docker-smoke/repository add .
          git -C scripts/docker-smoke/repository commit -m "Fixture"
          docker run --detach --name whiteboard-ci-smoke \
            --init \
            --publish 3000:3000 \
            --env WHITEBOARD_TOKEN="$WHITEBOARD_TOKEN" \
            --volume "$CODE_ROOT:$CODE_ROOT" \
            whiteboard:ci-smoke
          health_url=http://127.0.0.1:3000/health
          for _ in $(seq 1 60); do
            if curl --fail --silent "$health_url" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/health >/dev/null
          scripts/docker-smoke/seed.sh whiteboard-ci-smoke "$CODE_ROOT"
          SMOKE_SCREENSHOT="$PWD/artifacts/docker-smoke-failure.png" \
            WHITEBOARD_TOKEN="$WHITEBOARD_TOKEN" \
            node scripts/docker-smoke/smoke.mjs

      - name: Capture container logs on failure
        if: failure()
        run: |
          docker logs whiteboard-ci-smoke > artifacts/container.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-web-smoke-failure
          path: artifacts/
          if-no-files-found: warn

      - name: Stop container
        if: always()
        run: docker rm --force whiteboard-ci-smoke || true
