apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: whiteboard-api
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_ID
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      sessionAffinity: false
      serviceAccountName: whiteboard-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/whiteboard/whiteboard:TAG
          ports:
            - name: http1
              containerPort: 7421
          env:
            - name: WHITEBOARD_MODE
              value: remote
            - name: WHITEBOARD_DB
              valueFrom:
                secretKeyRef:
                  name: whiteboard-postgres-url
                  key: latest
            - name: WHITEBOARD_BLOBS
              value: s3://WHITEBOARD_BUCKET
            - name: WHITEBOARD_S3_ENDPOINT
              value: https://storage.googleapis.com
            - name: WHITEBOARD_S3_REGION
              value: us-central1
            - name: WHITEBOARD_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: whiteboard-gcs-hmac-access-id
                  key: latest
            - name: WHITEBOARD_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: whiteboard-gcs-hmac-secret
                  key: latest
            - name: WHITEBOARD_REPO_SOURCE
              value: github
            - name: WHITEBOARD_JOBS
              value: queue
            - name: WHITEBOARD_JOB_SECRET
              valueFrom:
                secretKeyRef:
                  name: whiteboard-job-secret
                  key: latest
            - name: WHITEBOARD_AUTH
              value: oauth
            - name: WHITEBOARD_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: whiteboard-auth-secret
                  key: latest
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: whiteboard-github-oauth-client-id
                  key: latest
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: whiteboard-github-oauth-client-secret
                  key: latest
            - name: WHITEBOARD_PORT
              value: "7421"
          startupProbe:
            httpGet:
              path: /health
              port: 7421
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 7421
            periodSeconds: 30
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
