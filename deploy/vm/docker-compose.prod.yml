# Production stack for whiteboard.binodswain.dev. The deploy workflow copies
# this file to ~/services/whiteboard on the VM, loads the image it built, and
# writes .env.prod from GitHub secrets — nothing here is a secret.
name: whiteboard

services:
  whiteboard:
    image: whiteboard:${WHITEBOARD_IMAGE_TAG:?set by the deploy workflow}
    init: true
    stop_grace_period: 30s
    ports:
      # Caddy on the host is the only public entry point.
      - "127.0.0.1:7421:7421"
    env_file:
      - .env.prod
    environment:
      HOME: /tmp
      WHITEBOARD_PORT: "7421"
      WHITEBOARD_MODE: remote
      WHITEBOARD_REPO_SOURCE: github
      # One VM, one process: run jobs in-process instead of a queue runner.
      WHITEBOARD_JOBS: inline
      WHITEBOARD_AUTH: oauth
      WHITEBOARD_S3_REGION: auto
    volumes:
      - whiteboard-data:/data
    command:
      - whiteboard
      - server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "7421"
      - --web
      - /app/web
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7421/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Writes the summary for each pull request review. Opt in with
  # `--profile reviewer`; it needs .env.reviewer holding WHITEBOARD_TOKEN (an
  # API token for the runner, not the server's secrets) and one model
  # provider key such as ANTHROPIC_API_KEY. It holds no GitHub key, database
  # or /data: it reaches reviews only through the server, and each agent run
  # only through its ask's own token. Build the image with AGENTS=pi.
  reviewer:
    profiles: [reviewer]
    image: whiteboard:${WHITEBOARD_IMAGE_TAG:?set by the deploy workflow}
    init: true
    depends_on:
      whiteboard:
        condition: service_healthy
    env_file:
      - .env.reviewer
    environment:
      # Pi writes its MCP wrapper and settings under HOME.
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Run one ask per process so nothing carries over between pull requests;
    # restart picks up the next.
    command:
      - whiteboard
      - connect
      - --server
      - http://whiteboard:7421
      - --agent
      - pi
      - --kind
      - pr-review
      - --once
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
    restart: unless-stopped

volumes:
  whiteboard-data:
