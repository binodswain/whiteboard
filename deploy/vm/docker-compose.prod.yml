# Production stack for whiteboard.binodswain.dev. The deploy workflow copies
# this file to ~/services/whiteboard on the VM, loads the image it built, and
# writes .env.prod from GitHub secrets — nothing here is a secret.
name: whiteboard

services:
  whiteboard:
    image: whiteboard:${WHITEBOARD_IMAGE_TAG:?set by the deploy workflow}
    init: true
    stop_grace_period: 30s
    ports:
      # Caddy on the host is the only public entry point.
      - "127.0.0.1:7421:7421"
    env_file:
      - .env.prod
    environment:
      HOME: /tmp
      WHITEBOARD_PORT: "7421"
      WHITEBOARD_MODE: remote
      WHITEBOARD_REPO_SOURCE: github
      # One VM, one process: run jobs in-process instead of a queue runner.
      WHITEBOARD_JOBS: inline
      WHITEBOARD_AUTH: oauth
      WHITEBOARD_S3_REGION: auto
    volumes:
      - whiteboard-data:/data
    command:
      - whiteboard
      - server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "7421"
      - --web
      - /app/web
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7421/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  whiteboard-data:
