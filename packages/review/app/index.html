<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard Reviews</title>
    <meta
      name="description"
      content="Read and discuss code reviews as walkthroughs, diagrams and diffs."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath fill='%23fff' d='M12.02 51.78 25.82 12.22h5.16L17.18 51.78z'/%3E%3Cpath fill='%232b4fe0' d='M33.02 51.78 46.82 12.22h5.16L38.18 51.78z'/%3E%3C/svg%3E" />
    <style>
      /* The canvas stylesheet is scoped to .review-canvas-root; the page
         shell sizes itself and matches the canvas palette until it loads. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #fff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0c0f15;
        }
      }

      html[data-theme="light"] body {
        background: #fff;
      }

      html[data-theme="dark"] body {
        background: #0c0f15;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/web-entry.tsx"></script>
  </body>
</html>
